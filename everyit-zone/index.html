<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "@radix-ui/react-icons": "https://esm.sh/@radix-ui/react-icons@1?external=react",
      "emojibase": "https://esm.sh/emojibase@16?external=react"
    }
  }
</script>

<script type="module" src="https://esm.sh/tsx"></script>

<script type="text/babel" data-type="module">
  import React, { useState, useEffect, useCallback, useMemo, useRef } from "react";
  import { createRoot } from "react-dom/client";
  import {
    CopyIcon,
    CheckIcon,
    ChevronDownIcon,
  } from "@radix-ui/react-icons";

  const MAX_TEXT_LENGTH = 50000;
  const LARGE_TEXT_LENGTH = 10000;
  const EMOJI_PAGE_SIZE = 240;

  const splitWords = (text) =>
    text
      .trim()
      .split(/\s+/)
      .filter((word) => word.length > 0);

  const countWords = (text) => splitWords(text).length;

  const processTextWithEmoji = (inputText, emoji) => {
    if (!inputText.trim()) {
      return "";
    }

    const textToProcess =
      inputText.length > MAX_TEXT_LENGTH
        ? inputText.substring(0, MAX_TEXT_LENGTH) + "..."
        : inputText;

    const delimiter = emoji && typeof emoji === "string" ? emoji : "👏";

    return textToProcess
      .split("\n")
      .map((line) => {
        if (!line.trim()) {
          return "";
        }
        const words = splitWords(line);
        return words.length <= 1 ? words.join("") : words.join(` ${delimiter} `);
      })
      .join("\n");
  };

  const FALLBACK_EMOJIS = [
    { emoji: "👏", label: "clapping hands", tags: ["clap"], shortcodes: ["clap"] },
    { emoji: "🔥", label: "fire", tags: ["hot"], shortcodes: ["fire"] },
    { emoji: "💯", label: "hundred points", tags: ["perfect"], shortcodes: ["100"] },
    { emoji: "❤️", label: "red heart", tags: ["love"], shortcodes: ["heart"] },
    { emoji: "😂", label: "face with tears of joy", tags: ["laugh"], shortcodes: ["joy"] },
    { emoji: "🎉", label: "party popper", tags: ["celebration"], shortcodes: ["tada"] },
    { emoji: "🚀", label: "rocket", tags: ["space"], shortcodes: ["rocket"] },
    { emoji: "⭐", label: "star", tags: [], shortcodes: ["star"] },
    { emoji: "💪", label: "flexed biceps", tags: ["strong"], shortcodes: ["muscle"] },
    { emoji: "🎯", label: "direct hit", tags: ["target"], shortcodes: ["dart"] },
  ];

  const useEmojis = () => {
    const [emojis, setEmojis] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      const load = async () => {
        try {
          const { fetchEmojis } = await import("emojibase");
          const data = await fetchEmojis("en", { compact: false });
          setEmojis(
            data
              .filter((e) =>
                !(e.annotation || e.label || "")
                  .toLowerCase()
                  .includes("regional indicator")
              )
              .map((e) => ({
                emoji: e.emoji,
                label: e.annotation || e.label || "emoji",
                tags: e.tags || [],
                shortcodes: e.shortcodes || [],
              }))
          );
        } catch (err) {
          console.error("Failed to load emojis:", err);
          setEmojis(FALLBACK_EMOJIS);
        } finally {
          setLoading(false);
        }
      };
      load();
    }, []);

    return { emojis, loading };
  };

  const filterEmojis = (emojis, term) => {
    if (!term.trim()) {
      return emojis;
    }
    const q = term.toLowerCase();
    return emojis.filter(
      ({ label, emoji, tags, shortcodes }) =>
        label.toLowerCase().includes(q) ||
        emoji === term ||
        tags.some((t) => t.toLowerCase().includes(q)) ||
        shortcodes.some((c) => c.toLowerCase().includes(q))
    );
  };

  const useProcessedText = (inputText, emoji) => {
    const [delimitedText, setDelimitedText] = useState("");
    const [processingError, setProcessingError] = useState(false);

    useEffect(() => {
      const timeoutId = setTimeout(() => {
        try {
          setDelimitedText(processTextWithEmoji(inputText, emoji));
          setProcessingError(false);
        } catch (error) {
          console.error("Text processing failed:", error);
          setProcessingError(true);
          setDelimitedText("");
        }
      }, 300);
      return () => clearTimeout(timeoutId);
    }, [inputText, emoji]);

    return { delimitedText, processingError };
  };

  const useCopy = (text) => {
    const [copyState, setCopyState] = useState("idle");

    const copy = useCallback(async () => {
      if (!text || !text.trim()) {
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          if (!document.execCommand("copy")) {
            throw new Error("execCommand copy failed");
          }
          document.body.removeChild(textArea);
        }
        setCopyState("copied");
      } catch (err) {
        console.error("Copy failed:", err);
        setCopyState("error");
      }
      setTimeout(() => setCopyState("idle"), 2500);
    }, [text]);

    return { copyState, copy };
  };

  const EmojiDropdown = ({ selectedEmoji, onEmojiSelect, emojis, loading }) => {
    const [open, setOpen] = useState(false);
    const [term, setTerm] = useState("");
    const dropdownRef = useRef(null);

    useEffect(() => {
      const handleClickOutside = (event) => {
        if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
          setOpen(false);
          setTerm("");
        }
      };
      document.addEventListener("mousedown", handleClickOutside);
      return () => document.removeEventListener("mousedown", handleClickOutside);
    }, []);

    const results = filterEmojis(emojis, term);
    const shown = results.slice(0, EMOJI_PAGE_SIZE);
    const selectedLabel =
      emojis.find((e) => e.emoji === selectedEmoji)?.label || "emoji";

    const pick = (emoji) => {
      onEmojiSelect(emoji);
      setOpen(false);
      setTerm("");
    };

    return (
      <div className="relative flex-grow" ref={dropdownRef}>
        <button
          onClick={() => setOpen(!open)}
          aria-expanded={open}
          aria-haspopup="listbox"
          className="appearance-none w-full h-full flex items-center gap-3 rounded-md bg-white px-3.5 py-2 text-sm shadow-sm ring-1 ring-inset ring-slate-900/20 hover:ring-slate-400 focus:ring-slate-400 outline-none cursor-pointer"
        >
          <span className="text-xl" aria-hidden="true">
            {selectedEmoji}
          </span>
          <span>{selectedLabel}</span>
          <ChevronDownIcon className="ml-auto w-4 h-4 text-slate-500" />
        </button>

        {open && (
          <div className="absolute left-0 right-0 top-full mt-1 z-20 overflow-hidden rounded-md bg-white shadow-lg ring-1 ring-slate-900/10">
            <div className="border-b border-slate-200 p-2">
              <input
                type="text"
                value={term}
                onChange={(e) => setTerm(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Escape") {
                    setOpen(false);
                    setTerm("");
                  }
                }}
                placeholder="Search emojis…"
                autoFocus
                className="appearance-none w-full rounded-md bg-white/5 px-3 py-1.5 text-sm ring-1 ring-inset ring-slate-900/20 placeholder:text-slate-400 focus:ring-slate-400 outline-none"
              />
            </div>
            <div className="max-h-64 overflow-y-auto p-1">
              {loading ? (
                <p className="px-2 py-3 text-center text-sm text-slate-500">
                  Loading emojis…
                </p>
              ) : shown.length === 0 ? (
                <p className="px-2 py-3 text-center text-sm text-slate-500">
                  No emojis found for "{term}"
                </p>
              ) : (
                shown.map(({ emoji, label }) => (
                  <button
                    key={emoji}
                    onClick={() => pick(emoji)}
                    className="w-full flex items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm text-slate-900 hover:bg-slate-100 cursor-pointer"
                  >
                    <span className="text-lg" aria-hidden="true">
                      {emoji}
                    </span>
                    <span>{label}</span>
                    {emoji === selectedEmoji && (
                      <span className="ml-auto text-xs text-slate-500">✓</span>
                    )}
                  </button>
                ))
              )}
            </div>
          </div>
        )}
      </div>
    );
  };

  const EmojiTextDelimiter = () => {
    const [inputText, setInputText] = useState("");
    const [selectedEmoji, setSelectedEmoji] = useState("👏");
    const { emojis, loading: emojisLoading } = useEmojis();
    const { delimitedText, processingError } = useProcessedText(
      inputText,
      selectedEmoji
    );
    const { copyState, copy } = useCopy(delimitedText);

    const charCount = inputText.length;
    const wordCount = useMemo(() => countWords(inputText), [inputText]);
    const warning =
      charCount > MAX_TEXT_LENGTH
        ? `Text too long — will be truncated to ${MAX_TEXT_LENGTH.toLocaleString()} characters`
        : charCount > LARGE_TEXT_LENGTH
        ? "Large text — processing may be slower"
        : "";

    return (
      <>
        <div className="sr-only" aria-live="polite" role="status">
          {copyState === "copied" && "Text copied to clipboard."}
          {copyState === "error" && "Copy failed."}
        </div>

        <div className="bg-slate-50 text-slate-900 p-8 rounded-xl selection:bg-slate-900! selection:text-slate-50!">
          <div
            className={`mb-1 text-right text-sm tabular-nums text-slate-500 ${
              charCount === 0 ? "invisible" : ""
            }`}
            aria-hidden={charCount === 0}
          >
            {charCount.toLocaleString()} characters •{" "}
            {wordCount.toLocaleString()} words
          </div>

          <label htmlFor="emoji-text-input" className="sr-only">
            Text to delimit
          </label>
          <textarea
            id="emoji-text-input"
            value={inputText}
            onChange={(e) => setInputText(e.target.value)}
            placeholder="Type your text here…"
            autoFocus
            spellCheck={false}
            className="appearance-none w-full h-48 rounded-md bg-white/5 px-3.5 py-2 font-mono text-sm shadow-sm ring-1 ring-inset ring-slate-900/20 hover:ring-slate-400 focus:ring-slate-400 placeholder:text-slate-400 text-slate-900 outline-none resize-none"
          />
          {warning && (
            <p className="mt-2 text-sm text-amber-600" role="alert">
              {warning}
            </p>
          )}

          <div className="mt-4 flex flex-col sm:flex-row gap-4 items-stretch">
            <EmojiDropdown
              selectedEmoji={selectedEmoji}
              onEmojiSelect={setSelectedEmoji}
              emojis={emojis}
              loading={emojisLoading}
            />
            <button
              onClick={copy}
              disabled={!delimitedText}
              className="rounded-lg font-semibold py-3 px-4 bg-slate-900 text-white flex gap-x-1 items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer"
            >
              {copyState === "copied" ? (
                <CheckIcon className="w-4 h-4 text-green-400" />
              ) : (
                <CopyIcon className="w-4 h-4" />
              )}
              Copy
            </button>
          </div>
          {copyState === "error" && (
            <p className="mt-2 text-sm text-red-600" role="alert">
              Copy failed — select the text below and press ⌘C.
            </p>
          )}

          <div className="mt-4 min-h-40 max-h-96 overflow-y-auto rounded-md bg-white px-3.5 py-2.5 font-mono text-sm shadow-sm ring-1 ring-inset ring-slate-900/10 whitespace-pre-wrap break-words">
            {processingError ? (
              <span className="text-red-600">
                Couldn't process that text — try something shorter.
              </span>
            ) : delimitedText ? (
              delimitedText
            ) : (
              <span className="text-slate-400 italic">
                Your delimited text will appear here…
              </span>
            )}
          </div>
        </div>
      </>
    );
  };

  const container = document.getElementById("react-root");
  const root = createRoot(container);
  root.render(<EmojiTextDelimiter />);
</script>
