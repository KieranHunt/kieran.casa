name: Dependabot auto-merge

on: status

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.sha }}
  cancel-in-progress: true

jobs:
  visual-diff:
    if: github.event.context == 'deploy/netlify' && github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find open dependabot PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls" \
            --jq '[.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == "${{ github.event.sha }}")][0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open dependabot PR with head ${{ github.event.sha }}; nothing to do."
            exit 0
          fi
          jq -r '"number=\(.number)"' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Start check run on the PR head
        id: check
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/check-runs" \
            -f name="Visual diff" -f head_sha="${{ github.event.sha }}" -f status=in_progress --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.number

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/visual-diff/package-lock.json

      - name: Install diff dependencies
        if: steps.pr.outputs.number
        working-directory: .github/visual-diff
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Diff preview against production
        id: diff
        if: steps.pr.outputs.number
        continue-on-error: true
        working-directory: .github/visual-diff
        env:
          PREVIEW_URL: ${{ github.event.target_url }}
          PROD_URL: https://kieran.casa
        run: node diff.mjs

      - name: Merge
        id: merge
        if: steps.pr.outputs.number && steps.diff.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --squash --delete-branch; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mergeable=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json mergeable --jq .mergeable)
          if [ "$mergeable" = "CONFLICTING" ]; then
            gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
              --body "Visual diff passed but the branch now conflicts with master, likely because another PR merged first. Waiting for dependabot to rebase; the fresh preview will retry."
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      - name: Upload diff images
        id: artifact
        if: steps.pr.outputs.number && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-pr-${{ steps.pr.outputs.number }}
          path: .github/visual-diff/out

      - name: Rebase if stale, otherwise flag for review
        id: triage
        if: steps.pr.outputs.number && steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=$(gh api "repos/${{ github.repository }}/compare/master...${{ github.event.sha }}" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "result=stale" >> "$GITHUB_OUTPUT"
            if gh api -X PUT "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/update-branch"; then
              gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
                --body "Deploy preview was $behind commit(s) behind master, so the visual diff compared stale content. Updated the branch to retry on a fresh preview."
            else
              gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
                --body "Deploy preview was $behind commit(s) behind master and the branch could not be updated automatically, likely a conflict with another merge. Waiting for dependabot to rebase."
            fi
            exit 0
          fi
          {
            cat .github/visual-diff/out/failures.md 2>/dev/null || echo "Visual diff failed before producing a report; see the workflow logs."
            echo
            echo "Screenshots (preview/prod/diff): ${{ steps.artifact.outputs.artifact-url }}"
            echo
            echo "Not auto-merging. Review, then merge or close manually."
          } > comment.md
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --body-file comment.md
          echo "result=flagged" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Complete check run
        if: always() && steps.check.outputs.id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=failure
          title="Visual diff did not complete"
          summary="See the workflow run for details."
          if [ "${{ steps.merge.outputs.result }}" = "merged" ]; then
            conclusion=success
            title="Preview matches production"
            summary="All checks passed; merged automatically."
          elif [ "${{ steps.merge.outputs.result }}" = "conflict" ]; then
            conclusion=neutral
            title="Passed, but the branch conflicts with master"
            summary="Visual diff passed; waiting for a rebase before merging."
          elif [ "${{ steps.triage.outputs.result }}" = "stale" ]; then
            conclusion=neutral
            title="Preview was stale"
            summary="Preview was behind master; the branch was updated to retry on fresh content."
          elif [ -f .github/visual-diff/out/failures.md ]; then
            title="Preview differs from production"
            summary=$(cat .github/visual-diff/out/failures.md)
          fi
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.check.outputs.id }}" -X PATCH \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=$title" -f "output[summary]=$summary"
